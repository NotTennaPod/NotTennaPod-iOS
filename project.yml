  NotTennaPodUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      # The video fixture server's Python cache is local build output, not a test resource.
      - path: AppUITests
        excludes: ["**/__pycache__"]
      # Journeys that need a server whose responses the test controls while the app is terminated.
      - Tests/NotTennaPodCoreTests/LoopbackHTTPServer.swift
    dependencies:
      - target: NotTennaPod
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Restores portrait after every test, also when a failure skips the test's own restore (OrientationGuard.swift).
        INFOPLIST_KEY_NSPrincipalClass: UITestOrientationGuard
schemes:
  NotTennaPodProbeTests:
    build:
      targets:
        NotTennaPod: all
        NotTennaPodProbeTests: [test]
    test:
      targets: [NotTennaPodProbeTests]
      commandLineArguments:
        "-test-library-id 7C96A453-51F6-4676-A9F5-C7C5D03A4C75": true
        "-test-muted-playback": true
  NotTennaPod:
    build:
      targets:
        NotTennaPod: all
        NotTennaPodUITests: [test]
    test:
      targets: [NotTennaPodUITests]
      # The UI tests' loopback fixture servers (Tools/test-fixtures.sh) start before and stop after
      # every test run, for the Simulator that runs it.
      preActions:
        - name: Start UI-test fixture servers
          settingsTarget: NotTennaPod
          script: |
            mkdir -p "$SRCROOT/.work/test-fixtures"
            "$SRCROOT/Tools/test-fixtures.sh" start "$TARGET_DEVICE_IDENTIFIER" > "$SRCROOT/.work/test-fixtures/pre-action.log" 2>&1
      postActions:
        - name: Stop UI-test fixture servers
          settingsTarget: NotTennaPod
          script: |
            "$SRCROOT/Tools/test-fixtures.sh" stop "$TARGET_DEVICE_IDENTIFIER" > "$SRCROOT/.work/test-fixtures/post-action.log" 2>&1
      environmentVariables:
        PLAYBACK_VIDEO_FIXTURE_URL: http://127.0.0.1:59421
  NotTennaPodViewTests:
    build:
      targets:
        NotTennaPod: all
        NotTennaPodViewTests: [test]
    test:
      targets: [NotTennaPodViewTests]
      commandLineArguments:
        "-test-library-id 39F9E878-12C4-45CB-A73B-09065D8A41F7": true
        "-test-muted-playback": true
