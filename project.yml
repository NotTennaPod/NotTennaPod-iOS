name: NotTennaPod
options:
  bundleIdPrefix: org.nottennapod.app
  deploymentTarget:
    iOS: '27.0'
  xcodeVersion: '27.1'
packages:
  NotTennaPodCore:
    path: .
  GTMSessionFetcher:
    url: https://github.com/google/gtm-session-fetcher.git
    exactVersion: 5.3.1
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '27.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  NotTennaPod:
    type: application
    platform: iOS
    # WidgetShared holds the widget's intents and view, compiled into the app and the widget extension.
    sources: [App, UITestFixtures, WidgetShared]
    dependencies:
      - package: NotTennaPodCore
      - target: NotTennaPodShare
      - target: NotTennaPodWidget
      - framework: Vendor/GoogleCastSDK/GoogleCast.xcframework
        embed: false
      - package: GTMSessionFetcher
        product: GTMSessionFetcher
      - sdk: CoreData.framework
      - sdk: AVKit.framework
      - sdk: AVRouting.framework
    postCompileScripts:
      - name: Copy Google Cast platform resources
        script: python3 "$SRCROOT/Tools/copy-cast-resources.py"
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NotTennaPod
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.opml.opml
            UTTypeDescription: OPML document
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [opml]
              public.mime-type: [text/x-opml]
          # iOS declares public.rss but no Atom type.
          - UTTypeIdentifier: org.ietf.atom
            UTTypeDescription: Atom feed
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [atom]
              public.mime-type: [application/atom+xml]
        CFBundleDocumentTypes:
          - CFBundleTypeName: OPML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.opml.opml, public.xml, public.plain-text]
          # A feed document opens the preview of its own address.
          - CFBundleTypeName: Podcast feed
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.rss, org.ietf.atom]
        # OnlineFeedViewActivity's podcast protocols; nottennapod-share is the Share
        # Extension's internal handoff.
        CFBundleURLTypes:
          - CFBundleURLName: org.nottennapod.app.subscribe
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [itpc, pcast, feed, antennapod-subscribe]
          - CFBundleURLName: org.nottennapod.app.share
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [nottennapod-share]
          # The player widget's taps that open the player and the speed dialog.
          - CFBundleURLName: org.nottennapod.app.widget
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [nottennapod-widget]
        # The launcher shortcuts, in shortcuts.xml order. Titles are the Android labels.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: org.nottennapod.app.shortcut.queue
            UIApplicationShortcutItemTitle: Queue
            UIApplicationShortcutItemIconFile: ic_playlist_play
          - UIApplicationShortcutItemType: org.nottennapod.app.shortcut.episodes
            UIApplicationShortcutItemTitle: Episodes
            UIApplicationShortcutItemIconFile: ic_feed
          - UIApplicationShortcutItemType: org.nottennapod.app.shortcut.subscriptions
            UIApplicationShortcutItemTitle: Subscriptions
            UIApplicationShortcutItemIconFile: ic_subscriptions
          - UIApplicationShortcutItemType: org.nottennapod.app.shortcut.refresh
            UIApplicationShortcutItemTitle: Refresh
            UIApplicationShortcutItemIconFile: ic_refresh
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts: [Roboto-Regular.ttf]
        UIBackgroundModes: [audio, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [org.nottennapod.app.feed-refresh, org.nottennapod.app.database-backup, org.nottennapod.app.server-sync, org.nottennapod.app.server-sync-processing]
        NSBonjourServices: [_googlecast._tcp, _CC1AD845._googlecast._tcp]
        NSLocalNetworkUsageDescription: NotTennaPod uses your local network to find and connect to Cast devices.
        # The scene restoration activity: where each window was, saved by UIKit (SceneNavigationState).
        NSUserActivityTypes: [org.nottennapod.app.scene-restoration]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    # The App Group the widget extension reads the player snapshot from.
    entitlements:
      path: App/NotTennaPod.entitlements
      properties:
        com.apple.security.application-groups: [group.org.nottennapod.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nottennapod.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: [$(inherited), '-ObjC', '-lc++']
  # The Share Extension hands a shared link or text to the app.
  NotTennaPodShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Sources/NotTennaPodCore/ShareHandoff.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: NotTennaPod
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nottennapod.app.share
  # The Home Screen player widget and the Control Center control.
  NotTennaPodWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: ["Info.plist", "*.entitlements"]
      - WidgetShared
      - Sources/NotTennaPodCore/PlayerWidgetModel.swift
      - path: App/Resources/en.lproj
        buildPhase: resources
      - path: App/Resources/Roboto-Regular.ttf
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: NotTennaPod
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Roboto-Regular.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/NotTennaPodWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.org.nottennapod.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nottennapod.app.widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
